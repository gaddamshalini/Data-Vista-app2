# Render.com deployment configuration for DATA VISTA
# Docs: https://render.com/docs/render-yaml-spec

services:
  # ── Backend (Flask API) ─────────────────────────────────────────────────────
  - type: web
    name: datavista-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python startup_seed.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: datavista-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "false"

  # ── Frontend (React / Vite) ─────────────────────────────────────────────────
  - type: web
    name: datavista-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        # Replace with your actual backend service URL after first deploy
        value: https://datavista-backend.onrender.com

databases:
  - name: datavista-db
    databaseName: datavista
    plan: free
